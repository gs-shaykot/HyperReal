<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#c6ff00" stop-opacity="0"/>
      <stop offset=".5" stop-color="#c6ff00"/>
      <stop offset="1" stop-color="#c6ff00" stop-opacity="0"/>
    </linearGradient>
    <style>
      .m{animation:m 3.5s linear infinite}
      @keyframes m{from{transform:translateX(-300px)}to{transform:translateX(1200px)}}
      @media (prefers-reduced-motion:reduce){.m{animation:none;transform:translateX(450px)}}
    </style>
  </defs>
  <rect y="9" width="1200" height="1" fill="#c6ff00" fill-opacity=".25"/>
  <rect class="m" y="8" width="300" height="3" rx="1.5" fill="url(#g)"/>
  <rect x="0" y="6" width="8" height="8" fill="#c6ff00"/>
  <rect x="1192" y="6" width="8" height="8" fill="#c6ff00"/>
</svg>
