<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">HyperReal commerce pipeline</title>
  <desc id="d">User, Authentication, Product Discovery, Cart, Coupon, Checkout, Stripe, Order, Fulfillment, Shipment, Delivery. Failed or cancelled payments loop back to checkout for retry.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c6ff00" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text{font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .flow{stroke-dasharray:6 10;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-16}}
      .retry{stroke-dasharray:4 6;animation:dash 1.6s linear infinite reverse}
      .n rect{fill:#0b0b0b;stroke:#c6ff00;stroke-opacity:.35;stroke-width:1.5}
      .n{animation:hit 8s ease-out infinite}
      .n rect{animation:edge 8s ease-out infinite;animation-delay:inherit}
      @keyframes hit{0%{opacity:1}12%{opacity:.75}100%{opacity:.75}}
      @keyframes edge{0%{stroke-opacity:1;fill:#141a00}14%{stroke-opacity:.35;fill:#0b0b0b}100%{stroke-opacity:.35;fill:#0b0b0b}}
      .id{fill:#c6ff00;font-size:11px;letter-spacing:2px;opacity:.7}
      .nm{fill:#f2f2f2;font-size:15px;font-weight:700;letter-spacing:1.5px}
      .sb{fill:#8a8a8a;font-size:10px;letter-spacing:1px}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.n{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="560" rx="16" fill="#050505"/>
  <rect width="1200" height="560" rx="16" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="559" rx="16" fill="none" stroke="#c6ff00" stroke-opacity=".3"/>

  <text x="40" y="50" fill="#c6ff00" font-size="13" letter-spacing="3">// SYSTEM PIPELINE · REQUEST LIFECYCLE</text>
  <text x="1160" y="50" fill="#8a8a8a" font-size="12" letter-spacing="2" text-anchor="end">USER → DELIVERY</text>

  <!-- main route -->
  <path id="route" d="M100 170H1100V400H100" fill="none" stroke="#c6ff00" stroke-opacity=".18" stroke-width="2"/>
  <path d="M100 170H1100V400H100" fill="none" stroke="#c6ff00" stroke-width="2" class="flow"/>

  <!-- retry loop: Stripe -> Checkout -->
  <path d="M1020 375C930 340 930 230 1020 195" fill="none" stroke="#ff2e63" stroke-width="1.5" class="retry"/>
  <text x="900" y="282" fill="#ff2e63" font-size="11" letter-spacing="1.5" text-anchor="end">FAILED / CANCELLED</text>
  <text x="900" y="298" fill="#ff2e63" font-size="11" letter-spacing="1.5" text-anchor="end">→ RETRY · CART KEPT</text>

  <!-- nodes row 1 -->
  <g class="n" style="animation-delay:0s"><rect x="20" y="135" width="160" height="70" rx="8"/><text x="36" y="157" class="id">01</text><text x="36" y="180" class="nm">USER</text><text x="36" y="196" class="sb">ENTRY POINT</text></g>
  <g class="n" style="animation-delay:.72s"><rect x="220" y="135" width="160" height="70" rx="8"/><text x="236" y="157" class="id">02</text><text x="236" y="180" class="nm">AUTH</text><text x="236" y="196" class="sb">AUTH.JS · ARGON2</text></g>
  <g class="n" style="animation-delay:1.43s"><rect x="420" y="135" width="160" height="70" rx="8"/><text x="436" y="157" class="id">03</text><text x="436" y="180" class="nm">DISCOVERY</text><text x="436" y="196" class="sb">SEARCH KEYWORDS</text></g>
  <g class="n" style="animation-delay:2.15s"><rect x="620" y="135" width="160" height="70" rx="8"/><text x="636" y="157" class="id">04</text><text x="636" y="180" class="nm">CART</text><text x="636" y="196" class="sb">PERSISTENT</text></g>
  <g class="n" style="animation-delay:2.87s"><rect x="820" y="135" width="160" height="70" rx="8"/><text x="836" y="157" class="id">05</text><text x="836" y="180" class="nm">COUPON</text><text x="836" y="196" class="sb">SERVER-VALIDATED</text></g>
  <g class="n" style="animation-delay:3.59s"><rect x="1020" y="135" width="160" height="70" rx="8"/><text x="1036" y="157" class="id">06</text><text x="1036" y="180" class="nm">CHECKOUT</text><text x="1036" y="196" class="sb">SERVER PRICING</text></g>

  <!-- nodes row 2 -->
  <g class="n" style="animation-delay:4.41s"><rect x="1020" y="365" width="160" height="70" rx="8"/><text x="1036" y="387" class="id">07</text><text x="1036" y="410" class="nm">STRIPE</text><text x="1036" y="426" class="sb">VERIFY · IDEMPOTENT</text></g>
  <g class="n" style="animation-delay:5.31s"><rect x="770" y="365" width="160" height="70" rx="8"/><text x="786" y="387" class="id">08</text><text x="786" y="410" class="nm">ORDER</text><text x="786" y="426" class="sb">TRANSACTIONAL</text></g>
  <g class="n" style="animation-delay:6.21s"><rect x="520" y="365" width="160" height="70" rx="8"/><text x="536" y="387" class="id">09</text><text x="536" y="410" class="nm">FULFILLMENT</text><text x="536" y="426" class="sb">ASSIGN · DISPATCH</text></g>
  <g class="n" style="animation-delay:7.1s"><rect x="270" y="365" width="160" height="70" rx="8"/><text x="286" y="387" class="id">10</text><text x="286" y="410" class="nm">SHIPMENT</text><text x="286" y="426" class="sb">TRACKING</text></g>
  <g class="n" style="animation-delay:7.9s"><rect x="20" y="365" width="160" height="70" rx="8"/><text x="36" y="387" class="id">11</text><text x="36" y="410" class="nm">DELIVERY</text><text x="36" y="426" class="sb">DELIVERED ✓</text></g>

  <!-- data packets -->
  <g filter="url(#glow)">
    <circle r="7" fill="#c6ff00">
      <animateMotion dur="8s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#c6ff00" opacity=".55">
      <animateMotion dur="8s" begin="2.67s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="3.5" fill="#c6ff00" opacity=".55">
      <animateMotion dur="8s" begin="5.33s" repeatCount="indefinite"><mpath href="#route"/></animateMotion>
    </circle>
  </g>

  <!-- legend -->
  <g transform="translate(40 500)" font-size="11" letter-spacing="1.5">
    <circle cx="6" cy="-4" r="5" fill="#c6ff00"/>
    <text x="20" y="0" fill="#bdbdbd">DATA PACKET</text>
    <path d="M150 -4H190" stroke="#c6ff00" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="200" y="0" fill="#bdbdbd">HAPPY PATH</text>
    <path d="M330 -4H370" stroke="#ff2e63" stroke-width="1.5" stroke-dasharray="4 6"/>
    <text x="380" y="0" fill="#bdbdbd">PAYMENT RECOVERY</text>
    <text x="1120" y="0" fill="#8a8a8a" text-anchor="end">SERVER-AUTHORITATIVE PRICING · COUPONS · PAYMENT STATE</text>
  </g>
</svg>
