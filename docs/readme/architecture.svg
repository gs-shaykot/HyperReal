<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" aria-labelledby="t d" role="img" viewBox="0 0 1200 640"><title id="t">HyperReal architecture</title><desc id="d">Frontend (Next.js 16, React, Tailwind, DaisyUI) talks to the Next.js App Router backend (route handlers, server actions, Auth.js, validation, rate limiting, IP restrictions), which uses Prisma ORM over PostgreSQL. Stripe handles payments and Cloudinary handles images. Deployed on Vercel from GitHub.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#c6ff00" stroke-opacity=".05" d="M32 0H0V32"/></pattern><filter id="glow" width="500%" height="500%" x="-200%" y="-200%"><feGaussianBlur result="b" stdDeviation="3"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes db{0%{stroke-opacity:.4}50%{stroke-opacity:1}}text{font-family:&quot;Space Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.box,.ext{fill:#0b0b0b;stroke:#c6ff00;stroke-opacity:.45;stroke-width:1.5}.ext{stroke:#8a8a8a;stroke-opacity:.6}.h{fill:#c6ff00;font-size:16px;font-weight:700;letter-spacing:2px}.s{fill:#bdbdbd;font-size:11px;letter-spacing:1px}.k{fill:#c6ff00;font-size:10px;letter-spacing:2px;opacity:.7}.chip{fill:#121212;stroke:#c6ff00;stroke-opacity:.25}.ct{fill:#e6e6e6;font-size:10.5px;letter-spacing:1px;text-anchor:middle}.link,.link2{fill:none;stroke:#c6ff00;stroke-width:2;stroke-dasharray:5 8;animation:d 1s linear infinite}.link2{stroke:#8a8a8a;stroke-width:1.5;stroke-dasharray:4 7;animation:d 1.4s linear infinite}.db{animation:db 3s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="640" fill="#050505" rx="16"/><rect width="1200" height="640" fill="url(#grid)" rx="16"/><rect width="1160" height="600" x="20" y="20" fill="none" stroke="#c6ff00" stroke-dasharray="2 6" stroke-opacity=".3" rx="14"/><text x="44" y="50" fill="#c6ff00" font-size="13" letter-spacing="3">// VERCEL · PRODUCTION DEPLOYMENT</text><text x="1156" y="50" fill="#8a8a8a" font-size="12" letter-spacing="2" text-anchor="end">GITHUB main → BUILD → PRISMA GENERATE → DEPLOY</text><path d="M600 150V200" class="link"/><path d="M600 380V420" class="link"/><path d="M600 476V510" class="link"/><path d="M840 290H930" class="link2"/><path d="M360 290H270" class="link2"/><g fill="#c6ff00" filter="url(#glow)"><circle r="4"><animateMotion dur="2.4s" path="M600 150V200" repeatCount="indefinite"/></circle><circle r="4"><animateMotion begin="1.2s" dur="2.4s" path="M600 380V420" repeatCount="indefinite"/></circle><circle r="4"><animateMotion begin=".6s" dur="2.4s" path="M600 476V510" repeatCount="indefinite"/></circle><circle r="3" fill="#bdbdbd"><animateMotion dur="3s" path="M840 290H930" repeatCount="indefinite"/></circle><circle r="3" fill="#bdbdbd"><animateMotion begin="1.5s" dur="3s" path="M360 290H270" repeatCount="indefinite"/></circle></g><rect width="480" height="74" x="360" y="76" class="box" rx="10"/><text x="380" y="98" class="k">LAYER 01 · CLIENT</text><text x="380" y="122" class="h">FRONTEND</text><text x="380" y="140" class="s">Next.js 16 · React · TypeScript · Tailwind · DaisyUI</text><rect width="480" height="180" x="360" y="200" class="box" rx="10"/><text x="380" y="222" class="k">LAYER 02 · SERVER</text><text x="380" y="246" class="h">NEXT.JS APP ROUTER</text><g transform="translate(380 262)"><rect width="140" height="30" class="chip" rx="5"/><text x="70" y="19" class="ct">ROUTE HANDLERS</text><rect width="140" height="30" x="150" class="chip" rx="5"/><text x="220" y="19" class="ct">SERVER ACTIONS</text><rect width="140" height="30" x="300" class="chip" rx="5"/><text x="370" y="19" class="ct">AUTH.JS · RBAC</text><rect width="140" height="30" y="40" class="chip" rx="5"/><text x="70" y="59" class="ct">INPUT VALIDATION</text><rect width="140" height="30" x="150" y="40" class="chip" rx="5"/><text x="220" y="59" class="ct">RATE LIMITING</text><rect width="140" height="30" x="300" y="40" class="chip" rx="5"/><text x="370" y="59" class="ct">IP RESTRICTIONS</text><rect width="215" height="30" y="80" class="chip" rx="5"/><text x="107" y="99" class="ct">COUPON + PRICING ENGINE</text><rect width="215" height="30" x="225" y="80" class="chip" rx="5"/><text x="332" y="99" class="ct">IDEMPOTENCY GUARD</text></g><rect width="360" height="56" x="420" y="420" class="box" rx="10"/><text x="440" y="442" class="k">LAYER 03 · DATA ACCESS</text><text x="440" y="464" class="h">PRISMA ORM</text><text x="760" y="464" class="s" text-anchor="end">TRANSACTIONS</text><g transform="translate(470 510)"><path d="M0 14C0 -4 260 -4 260 14V76C260 94 0 94 0 76Z" class="box db"/><ellipse cx="130" cy="14" fill="#0b0b0b" stroke="#c6ff00" stroke-opacity=".6" stroke-width="1.5" rx="130" ry="14"/><text x="130" y="56" class="h" text-anchor="middle">POSTGRESQL</text><text x="130" y="74" class="s" text-anchor="middle">RELATIONAL · FK CONSTRAINTS</text></g><rect width="220" height="80" x="930" y="250" class="ext" rx="10"/><text x="950" y="272" class="k" style="fill:#bdbdbd">EXTERNAL · PAYMENTS</text><text x="950" y="296" class="h" style="fill:#f2f2f2">STRIPE</text><text x="950" y="316" class="s">Payment Intent / Checkout</text><rect width="220" height="80" x="50" y="250" class="ext" rx="10"/><text x="70" y="272" class="k" style="fill:#bdbdbd">EXTERNAL · MEDIA</text><text x="70" y="296" class="h" style="fill:#f2f2f2">CLOUDINARY</text><text x="70" y="316" class="s">Product imagery</text><text x="1150" y="400" class="s" text-anchor="end">Server-side verification</text><text x="1150" y="416" class="s" text-anchor="end">of payment results</text><text x="50" y="400" class="s">Env-based configuration</text><text x="50" y="416" class="s">per environment</text></svg>