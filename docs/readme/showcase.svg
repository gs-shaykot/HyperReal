<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" aria-labelledby="t d" role="img" viewBox="0 0 1200 720"><title id="t">HyperReal interface showcase</title><desc id="d">Stylised mockups of the product catalog, shopping cart, coupon system, lookbook, payment failed page, payment cancelled page and admin dashboard.</desc><defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#c6ff00" stop-opacity="0"/><stop offset=".5" stop-color="#c6ff00" stop-opacity=".08"/><stop offset="1" stop-color="#c6ff00" stop-opacity="0"/></linearGradient><style>@keyframes hot{0%{transform:scale(.6);opacity:1}}@keyframes blink{50%{opacity:0}}@keyframes pop{0%,35%{opacity:0}45%,90%{opacity:1}}@keyframes fill{0%{transform:scaleX(.2)}60%{transform:scaleX(.78)}}@keyframes warn{0%{opacity:.5}50%{opacity:1}}text{font-family:&quot;Space Mono&quot;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.pn{fill:#0a0a0a;stroke:#c6ff00;stroke-opacity:.3;stroke-width:1.5}.lb{fill:#c6ff00;font-size:11px;letter-spacing:2px}.m,.t{letter-spacing:1px}.t{fill:#f2f2f2;font-size:12px;font-weight:700}.m{fill:#8a8a8a;font-size:10px}.ph{fill:#151515}.ln{fill:#262626}.lime{fill:#c6ff00}.shim{animation:shim 3.5s ease-in-out infinite}.hot{animation:hot 2s ease-out infinite;transform-box:fill-box;transform-origin:center}.blink{animation:blink 1s steps(1) infinite}.pop{animation:pop 4s ease-in-out infinite}.fill{animation:fill 4s ease-in-out infinite;transform-origin:0 0}.bar{animation:bar 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}.warn{animation:warn 1.6s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.pop{opacity:1}}</style><clipPath id="c1"><rect width="270" height="310" rx="10"/></clipPath><clipPath id="c2"><rect width="564" height="310" rx="10"/></clipPath></defs><rect width="1200" height="720" fill="#050505" rx="16"/><text x="24" y="40" fill="#c6ff00" font-size="13" letter-spacing="3">// INTERFACE SHOWCASE · STYLISED MOCKUPS</text><g transform="translate(24 60)"><rect width="270" height="310" class="pn" rx="10"/><text x="16" y="28" class="lb">01 · CATALOG</text><g transform="translate(16 44)"><rect width="111" height="92" class="ph" rx="6"/><rect width="111" height="92" x="127" class="ph" rx="6"/><rect width="111" height="92" y="138" class="ph" rx="6"/><rect width="111" height="92" x="127" y="138" class="ph" rx="6"/><rect width="34" height="14" x="6" y="6" class="lime" rx="2"/><text x="10" y="17" fill="#050505" font-size="9" font-weight="700">NEW</text><rect width="80" height="6" y="100" class="ln" rx="3"/><text x="0" y="124" class="t">$180</text><rect width="70" height="6" x="127" y="100" class="ln" rx="3"/><text x="127" y="124" class="t">$240</text><rect width="90" height="6" y="238" class="ln" rx="3"/><rect width="60" height="6" x="127" y="238" class="ln" rx="3"/></g><g clip-path="url(#c1)"><rect width="200" height="310" fill="url(#sh)" class="shim"/></g></g><g transform="translate(318 60)"><rect width="270" height="310" class="pn" rx="10"/><text x="16" y="28" class="lb">02 · CART</text><g transform="translate(16 46)"><rect width="44" height="44" class="ph" rx="4"/><rect width="100" height="6" x="56" y="8" class="ln" rx="3"/><text x="56" y="34" class="m">QTY − 1 +</text><text x="238" y="30" class="t" text-anchor="end">$180</text><rect width="44" height="44" y="58" class="ph" rx="4"/><rect width="80" height="6" x="56" y="66" class="ln" rx="3"/><text x="56" y="92" class="m">QTY − 2 +</text><text x="238" y="88" class="t" text-anchor="end">$90</text><rect width="44" height="44" y="116" class="ph" rx="4"/><rect width="110" height="6" x="56" y="124" class="ln" rx="3"/><text x="56" y="150" class="m">QTY − 1 +</text><text x="238" y="146" class="t" text-anchor="end">$60</text><path stroke="#262626" d="M0 178H238"/><text x="0" y="200" class="m">SUBTOTAL</text><text x="238" y="200" class="m" text-anchor="end">$420.00</text><text x="0" y="220" class="t">TOTAL</text><text x=