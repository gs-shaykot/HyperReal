<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">HyperReal interface showcase</title>
  <desc id="d">Stylised mockups of the product catalog, shopping cart, coupon system, lookbook, payment failed page, payment cancelled page and admin dashboard.</desc>
  <defs>
    <linearGradient id="sh" x1="0" x2="1">
      <stop offset="0" stop-color="#c6ff00" stop-opacity="0"/>
      <stop offset=".5" stop-color="#c6ff00" stop-opacity=".08"/>
      <stop offset="1" stop-color="#c6ff00" stop-opacity="0"/>
    </linearGradient>
    <style>
      text{font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .pn{fill:#0a0a0a;stroke:#c6ff00;stroke-opacity:.3;stroke-width:1.5}
      .lb{fill:#c6ff00;font-size:11px;letter-spacing:2px}
      .t{fill:#f2f2f2;font-size:12px;font-weight:700;letter-spacing:1px}
      .m{fill:#8a8a8a;font-size:10px;letter-spacing:1px}
      .ph{fill:#151515}
      .ln{fill:#262626}
      .lime{fill:#c6ff00}
      .shim{animation:shim 3.5s ease-in-out infinite}
      @keyframes shim{from{transform:translateX(-300px)}to{transform:translateX(320px)}}
      .hot{animation:hot 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes hot{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pop{animation:pop 4s ease-in-out infinite}
      @keyframes pop{0%,35%{opacity:0}45%,90%{opacity:1}100%{opacity:0}}
      .fill{animation:fill 4s ease-in-out infinite;transform-origin:0 0}
      @keyframes fill{0%{transform:scaleX(.2)}60%,100%{transform:scaleX(.78)}}
      .bar{animation:bar 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
      @keyframes bar{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
      .warn{animation:warn 1.6s ease-in-out infinite}
      @keyframes warn{0%,100%{opacity:.5}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.pop{opacity:1}}
    </style>
    <clipPath id="c1"><rect width="270" height="310" rx="10"/></clipPath>
    <clipPath id="c2"><rect width="564" height="310" rx="10"/></clipPath>
  </defs>

  <rect width="1200" height="720" rx="16" fill="#050505"/>
  <text x="24" y="40" fill="#c6ff00" font-size="13" letter-spacing="3">// INTERFACE SHOWCASE · STYLISED MOCKUPS</text>

  <!-- CATALOG -->
  <g transform="translate(24 60)">
    <rect class="pn" width="270" height="310" rx="10"/>
    <text x="16" y="28" class="lb">01 · CATALOG</text>
    <g transform="translate(16 44)">
      <rect class="ph" width="111" height="92" rx="6"/><rect class="ph" x="127" width="111" height="92" rx="6"/>
      <rect class="ph" y="138" width="111" height="92" rx="6"/><rect class="ph" x="127" y="138" width="111" height="92" rx="6"/>
      <rect class="lime" x="6" y="6" width="34" height="14" rx="2"/><text x="10" y="17" font-size="9" fill="#050505" font-weight="700">NEW</text>
      <rect class="ln" y="100" width="80" height="6" rx="3"/><text x="0" y="124" class="t">$180</text>
      <rect class="ln" x="127" y="100" width="70" height="6" rx="3"/><text x="127" y="124" class="t">$240</text>
      <rect class="ln" y="238" width="90" height="6" rx="3"/>
      <rect class="ln" x="127" y="238" width="60" height="6" rx="3"/>
    </g>
    <g clip-path="url(#c1)"><rect class="shim" width="200" height="310" fill="url(#sh)"/></g>
  </g>

  <!-- CART -->
  <g transform="translate(318 60)">
    <rect class="pn" width="270" height="310" rx="10"/>
    <text x="16" y="28" class="lb">02 · CART</text>
    <g transform="translate(16 46)">
      <rect class="ph" width="44" height="44" rx="4"/><rect class="ln" x="56" y="8" width="100" height="6" rx="3"/><text x="56" y="34" class="m">QTY  − 1 +</text><text x="238" y="30" class="t" text-anchor="end">$180</text>
      <rect class="ph" y="58" width="44" height="44" rx="4"/><rect class="ln" x="56" y="66" width="80" height="6" rx="3"/><text x="56" y="92" class="m">QTY  − 2 +</text><text x="238" y="88" class="t" text-anchor="end">$90</text>
      <rect class="ph" y="116" width="44" height="44" rx="4"/><rect class="ln" x="56" y="124" width="110" height="6" rx="3"/><text x="56" y="150" class="m">QTY  − 1 +</text><text x="238" y="146" class="t" text-anchor="end">$60</text>
      <path d="M0 178H238" stroke="#262626"/>
      <text x="0" y="200" class="m">SUBTOTAL</text><text x="238" y="200" class="m" text-anchor="end">$420.00</text>
      <text x="0" y="220" class="t">TOTAL</text><text x="238" y="220" class="t" text-anchor="end" fill="#c6ff00">USD</text>
      <rect class="lime" y="232" width="238" height="26" rx="4"/><text x="119" y="249" font-size="11" font-weight="700" fill="#050505" text-anchor="middle" letter-spacing="2">CHECKOUT →</text>
    </g>
  </g>

  <!-- COUPON -->
  <g transform="translate(612 60)">
    <rect class="pn" width="270" height="310" rx="10"/>
    <text x="16" y="28" class="lb">03 · COUPON ENGINE</text>
    <g transform="translate(16 50)">
      <rect width="160" height="34" rx="4" fill="#121212" stroke="#c6ff00" stroke-opacity=".4"/>
      <text x="12" y="22" class="t">WELCOME10<tspan class="blink" fill="#c6ff00">▌</tspan></text>
      <rect class="lime" x="168" width="70" height="34" rx="4"/><text x="203" y="22" font-size="11" font-weight="700" fill="#050505" text-anchor="middle">APPLY</text>
      <g class="pop">
        <rect y="46" width="238" height="30" rx="4" fill="#141a00" stroke="#c6ff00" stroke-opacity=".6"/>
        <text x="12" y="66" class="m" fill="#c6ff00">✓ VERIFIED SERVER-SIDE · −10%</text>
      </g>
      <text x="0" y="110" class="m">BEST ELIGIBLE COUPON</text>
      <rect y="118" width="238" height="40" rx="4" fill="#121212" stroke="#262626"/>
      <text x="12" y="143" class="t">RACE10</text><text x="226" y="143" class="m" text-anchor="end">MIN. SPEND RULE</text>
      <text x="0" y="186" class="m">PROGRESS TO NEXT RULE</text>
      <rect y="194" width="238" height="8" rx="4" fill="#1a1a1a"/>
      <rect class="lime fill" y="194" width="238" height="8" rx="4"/>
      <text x="0" y="230" class="m">NEW-USER RESTRICTION</text>
      <rect y="238" width="238" height="20" rx="4" fill="#1a0a0e" stroke="#ff2e63" stroke-opacity=".5"/>
      <text x="10" y="252" font-size="10" fill="#ff2e63" letter-spacing="1">✕ REJECTED · NOT ELIGIBLE</text>
    </g>
  </g>

  <!-- LOOKBOOK -->
  <g transform="translate(906 60)">
    <rect class="pn" width="270" height="310" rx="10"/>
    <text x="16" y="28" class="lb">04 · LOOKBOOK</text>
    <rect class="ph" x="16" y="44" width="238" height="250" rx="6"/>
    <path d="M135 80c-20 0-30 14-30 30v70l-14 90h88l-14-90v-70c0-16-10-30-30-30z" fill="#1e1e1e"/>
    <circle cx="135" cy="66" r="16" fill="#1e1e1e"/>
    <g fill="#c6ff00">
      <circle cx="122" cy="132" r="5"/><circle class="hot" cx="122" cy="132" r="5" fill="none" stroke="#c6ff00" stroke-width="2"/>
      <circle cx="150" cy="232" r="5"/><circle class="hot" cx="150" cy="232" r="5" fill="none" stroke="#c6ff00" stroke-width="2" style="animation-delay:.7s"/>
    </g>
    <g class="pop">
      <path d="M128 132H160" stroke="#c6ff00"/>
      <rect x="160" y="112" width="86" height="42" rx="4" fill="#050505" stroke="#c6ff00"/>
      <text x="168" y="130" font-size="10" fill="#f2f2f2" font-weight="700">SHELL JKT</text>
      <text x="168" y="146" font-size="10" fill="#c6ff00">VIEW →</text>
    </g>
    <rect x="28" y="262" width="96" height="22" rx="3" fill="#050505" stroke="#c6ff00" stroke-opacity=".6"/>
    <text x="76" y="277" font-size="9.5" fill="#c6ff00" text-anchor="middle" letter-spacing="1">EXPLORE LOOK</text>
  </g>

  <!-- PAYMENT FAILED -->
  <g transform="translate(24 394)">
    <rect width="270" height="310" rx="10" fill="#0a0a0a" stroke="#ff2e63" stroke-opacity=".5" stroke-width="1.5"/>
    <text x="16" y="28" class="lb" fill="#ff2e63">05 · /FAILED</text>
    <g class="warn"><circle cx="135" cy="110" r="38" fill="none" stroke="#ff2e63" stroke-width="2"/></g>
    <path d="M120 95l30 30M150 95l-30 30" stroke="#ff2e63" stroke-width="3" stroke-linecap="round"/>
    <text x="135" y="178" text-anchor="middle" class="t" fill="#ff2e63" letter-spacing="2">PAYMENT FAILED</text>
    <text x="135" y="200" text-anchor="middle" class="m">Rejected server-side</text>
    <text x="135" y="216" text-anchor="middle" class="m">Your cart is preserved</text>
    <rect x="40" y="236" width="190" height="30" rx="4" fill="#ff2e63"/>
    <text x="135" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#050505" letter-spacing="2">RETRY PAYMENT</text>
  </g>

  <!-- PAYMENT CANCELLED -->
  <g transform="translate(318 394)">
    <rect class="pn" width="270" height="310" rx="10"/>
    <text x="16" y="28" class="lb">06 · /CANCEL</text>
    <circle cx="135" cy="110" r="38" fill="none" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0 135 110" to="360 135 110" dur="10s" repeatCount="indefinite"/>
    </circle>
    <rect x="118" y="100" width="34" height="20" rx="3" fill="none" stroke="#c6ff00" stroke-width="2"/>
    <path d="M118 104h34" stroke="#c6ff00" stroke-width="2"/>
    <text x="135" y="178" text-anchor="middle" class="t" letter-spacing="2">PAYMENT CANCELLED</text>
    <text x="135" y="200" text-anchor="middle" class="m">No charge was made</text>
    <text x="135" y="216" text-anchor="middle" class="m">Resume whenever you're ready</text>
    <rect x="40" y="236" width="190" height="30" rx="4" fill="none" stroke="#c6ff00"/>
    <text x="135" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#c6ff00" letter-spacing="2">RETURN TO CHECKOUT</text>
  </g>

  <!-- ADMIN -->
  <g transform="translate(612 394)">
    <rect class="pn" width="564" height="310" rx="10"/>
    <text x="16" y="28" class="lb">07 · ADMIN DASHBOARD</text>
    <rect x="16" y="44" width="96" height="250" rx="6" fill="#0f0f0f"/>
    <g fill="#262626"><rect x="28" y="60" width="72" height="8" rx="3" fill="#c6ff00"/><rect x="28" y="84" width="60" height="8" rx="3"/><rect x="28" y="108" width="66" height="8" rx="3"/><rect x="28" y="132" width="54" height="8" rx="3"/><rect x="28" y="156" width="64" height="8" rx="3"/><rect x="28" y="180" width="58" height="8" rx="3"/></g>
    <g transform="translate(126 44)">
      <rect width="130" height="56" rx="6" fill="#121212"/><text x="12" y="20" class="m">ORDERS</text><rect class="ln" x="12" y="32" width="60" height="10" rx="3"/>
      <rect x="140" width="130" height="56" rx="6" fill="#121212"/><text x="152" y="20" class="m">FULFILLMENT</text><rect class="ln" x="152" y="32" width="50" height="10" rx="3"/>
      <rect x="280" width="142" height="56" rx="6" fill="#121212"/><text x="292" y="20" class="m">SHIPMENTS</text><rect class="ln" x="292" y="32" width="70" height="10" rx="3"/>
      <rect y="68" width="200" height="182" rx="6" fill="#0f0f0f"/>
      <g fill="#c6ff00">
        <rect class="bar" x="16" y="110" width="18" height="120" rx="2" style="animation-delay:0s"/>
        <rect class="bar" x="46" y="110" width="18" height="120" rx="2" style="animation-delay:.4s" opacity=".7"/>
        <rect class="bar" x="76" y="110" width="18" height="120" rx="2" style="animation-delay:.8s"/>
        <rect class="bar" x="106" y="110" width="18" height="120" rx="2" style="animation-delay:1.2s" opacity=".7"/>
        <rect class="bar" x="136" y="110" width="18" height="120" rx="2" style="animation-delay:1.6s"/>
        <rect class="bar" x="166" y="110" width="18" height="120" rx="2" style="animation-delay:2s" opacity=".7"/>
      </g>
      <g transform="translate(212 68)">
        <rect width="210" height="182" rx="6" fill="#0f0f0f"/>
        <g font-size="9.5" letter-spacing="1">
          <text x="10" y="22" fill="#8a8a8a">ORDER</text><text x="200" y="22" fill="#8a8a8a" text-anchor="end">STATUS</text>
          <text x="10" y="50" fill="#e6e6e6">#1042</text><text x="200" y="50" fill="#c6ff00" text-anchor="end">DISPATCHED</text>
          <text x="10" y="78" fill="#e6e6e6">#1041</text><text x="200" y="78" fill="#e6e6e6" text-anchor="end">PROCESSING</text>
          <text x="10" y="106" fill="#e6e6e6">#1040</text><text x="200" y="106" fill="#c6ff00" text-anchor="end">IN TRANSIT</text>
          <text x="10" y="134" fill="#e6e6e6">#1039</text><text x="200" y="134" fill="#ff2e63" text-anchor="end">PAYMENT FAILED</text>
          <text x="10" y="162" fill="#e6e6e6">#1038</text><text x="200" y="162" fill="#c6ff00" text-anchor="end">DELIVERED</text>
        </g>
      </g>
    </g>
    <g clip-path="url(#c2)"><rect class="shim" width="260" height="310" fill="url(#sh)" style="animation-duration:5s"/></g>
  </g>
</svg>
