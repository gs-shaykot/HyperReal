<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
  <title id="t">HYPERREAL</title>
  <desc id="d">Full-stack e-commerce engineering project. Animated cyberpunk hero banner with grid, scan line and neon typography.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c6ff00" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#c6ff00" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c6ff00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6ff00" stop-opacity="0"/>
      <stop offset=".85" stop-color="#c6ff00" stop-opacity=".14"/>
      <stop offset="1" stop-color="#c6ff00" stop-opacity=".55"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="440" rx="18"/></clipPath>
    <style>
      text{font-family:"Space Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .grid{animation:drift 6s linear infinite}
      @keyframes drift{to{transform:translateY(40px)}}
      .scan{animation:scan 5s ease-in-out infinite}
      @keyframes scan{0%{transform:translateY(-140px)}100%{transform:translateY(440px)}}
      .p{animation:float 7s ease-in-out infinite;fill:#c6ff00}
      @keyframes float{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-26px);opacity:.9}}
      .title{animation:flicker 4s steps(1) infinite}
      @keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.35}94%{opacity:1}96%{opacity:.6}97%{opacity:1}}
      .gr{animation:gr 3.2s steps(1) infinite;opacity:0}
      .gc{animation:gc 3.2s steps(1) infinite;opacity:0}
      @keyframes gr{0%,86%,100%{opacity:0;transform:translate(0,0)}87%{opacity:.8;transform:translate(-5px,2px)}90%{opacity:.6;transform:translate(4px,-1px)}93%{opacity:0}}
      @keyframes gc{0%,86%,100%{opacity:0;transform:translate(0,0)}88%{opacity:.7;transform:translate(5px,-2px)}91%{opacity:.5;transform:translate(-3px,1px)}94%{opacity:0}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .bar{animation:load 3.6s ease-in-out infinite;transform-origin:0 0}
      @keyframes load{0%{transform:scaleX(0)}70%,100%{transform:scaleX(1)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#050505"/>
    <g class="grid"><rect y="-40" width="1200" height="520" fill="url(#grid)"/></g>
    <rect width="1200" height="440" fill="url(#glow)"/>

    <!-- particles -->
    <g>
      <circle class="p" cx="90" cy="330" r="2" style="animation-delay:0s"/>
      <circle class="p" cx="180" cy="120" r="1.5" style="animation-delay:-1.2s"/>
      <circle class="p" cx="260" cy="380" r="2.5" style="animation-delay:-2.4s"/>
      <circle class="p" cx="340" cy="70" r="1.5" style="animation-delay:-3.1s"/>
      <circle class="p" cx="470" cy="360" r="2" style="animation-delay:-4.2s"/>
      <circle class="p" cx="560" cy="60" r="1.5" style="animation-delay:-5.3s"/>
      <circle class="p" cx="690" cy="390" r="2" style="animation-delay:-0.6s"/>
      <circle class="p" cx="770" cy="90" r="2.5" style="animation-delay:-1.8s"/>
      <circle class="p" cx="880" cy="350" r="1.5" style="animation-delay:-2.9s"/>
      <circle class="p" cx="960" cy="110" r="2" style="animation-delay:-3.7s"/>
      <circle class="p" cx="1050" cy="300" r="2.5" style="animation-delay:-4.8s"/>
      <circle class="p" cx="1120" cy="150" r="1.5" style="animation-delay:-6.1s"/>
    </g>

    <g class="scan"><rect width="1200" height="140" fill="url(#scan)"/></g>
  </g>

  <!-- frame + HUD brackets -->
  <rect x=".5" y=".5" width="1199" height="439" rx="18" fill="none" stroke="#c6ff00" stroke-opacity=".35"/>
  <g stroke="#c6ff00" stroke-width="3" fill="none">
    <path d="M28 70V28H70"/><path d="M1130 28H1172V70"/>
    <path d="M28 370V412H70"/><path d="M1130 412H1172V370"/>
  </g>

  <text x="48" y="58" fill="#c6ff00" font-size="13" letter-spacing="3" opacity=".8">SYS://HYPERREAL</text>
  <text x="1152" y="58" fill="#c6ff00" font-size="13" letter-spacing="3" opacity=".8" text-anchor="end">STATUS: ONLINE <tspan class="blink">█</tspan></text>

  <!-- title with glitch layers -->
  <g text-anchor="middle" font-size="124" font-weight="700" letter-spacing="10">
    <text class="gr" x="600" y="226" fill="#ff2e63">HYPERREAL</text>
    <text class="gc" x="600" y="226" fill="#00f0ff">HYPERREAL</text>
    <text class="title" x="600" y="226" fill="#c6ff00" filter="url(#neon)">HYPERREAL</text>
  </g>

  <text x="600" y="282" text-anchor="middle" fill="#f2f2f2" font-size="20" letter-spacing="7">FULL-STACK E-COMMERCE ENGINEERING PROJECT</text>

  <g transform="translate(420 310)">
    <rect width="360" height="4" rx="2" fill="#c6ff00" fill-opacity=".12"/>
    <rect class="bar" width="360" height="4" rx="2" fill="#c6ff00"/>
  </g>

  <text x="600" y="352" text-anchor="middle" fill="#9a9a9a" font-size="14" letter-spacing="4">// ENGINEERING BEYOND THE INTERFACE</text>
  <text x="48" y="400" fill="#c6ff00" font-size="12" letter-spacing="2" opacity=".6">AUTH · PAYMENTS · ORDERS · FULFILLMENT · SHIPPING · SECURITY</text>
  <text x="1152" y="400" fill="#c6ff00" font-size="12" letter-spacing="2" opacity=".6" text-anchor="end">BUILD: PRODUCTION</text>
</svg>
